############### 센터 소개 ##############
center:
  enable: true
  image: 'images/center_intro_3.jpeg'
  image_room: 'images/ssroom.jpeg'
  title: "심리상담소 봄나눔"
  content: |
    먼저 저를 찾아주시고 이 공간에 방문 해주셔서 감사드립니다. 상담실 안팎에서의 목격했던 순간들을 통해 심리상담소의 이름을 “봄나눔” 으로 지었습니다. 아주 긴 겨울을 견뎌내고 결국 연둣빛 새싹을 틔워내고야 마는 봄처럼, 지난 몇 년간 내담자 분들과 함께 하는 여정은 새로운 희망과 용기, 그리고 가능성을 함께 마주하는 순간들이었습니다. 

    심리상담소 봄나눔에서는 청소년과 성인을 대상으로 한국어와 영어로 개인 심리상담을 제공하고 있습니다. 서울을 기반으로 대면 상담을 진행하며, 한국 전역에서 안전한 온라인 상담도 이용하실 수 있습니다. 2026년 8월 7일부터는 지하로 합정역과 바로 연결되는 마포한강2차푸르지오 오피스텔의 새 사무실에서 대면상담이 가능합니다.  

    도움을 요청하는 데에는 용기와 신뢰가 필요하다는 것을 잘 알고 있습니다. 그 소중한 믿음에 진심으로 감사드리며, 여러분의 회복과 성장의 여정을 함께할 수 있기를 기대합니다.
# "도움을..."문단 위에 있었던 내용
#   상담을 시작하고 싶으시다면, 웹사이트의 "[예약하기](/booking)" 페이지를 통해 상담을 신청해 주세요. 상담 신청 후에는 첫 상담을 함께 준비할 수 있도록 다음 절차를 안내하는 환영 이메일을 보내드립니다.


############### FAQ ##############
faq:
  enable: true
  title: "FAQ"
  faq_list:
    - name: 예약 과정이 어떻게 되나요?
      answer: A. "[예약하기](/booking)" 페이지를 스크롤 하시면 예약하는 방법에 대한 상세한 한국어 안내 슬라이드를 찾으실 수 있습니다. 이름과 연락처와 예약 사유를 남겨주시면 첫 상담에 앞서 선호하시는 언어로 작성된 전자문서 또한 미리 이메일로 받으실 수 있습니다.
      
    - name: 대면 상담도 예약할 수 있나요?
      answer: A. 네, 대면 상담도 진행하고 있습니다.   

    - name: 청소년 상담도 가능한가요?
      answer: A. 네, 고등학생 이상부터 상담을 받고 있습니다. 
 
    - name: 예약 없이 방문 상담이 가능한가요?
      answer: A. 죄송합니다. 모든 상담은 현재 사전 예약제로 운영되고 있으며, 더 준비되고 원활한 상담을 위해 최소 48시간 전에 예약해 주셔야 합니다.

    - name: 한국이 아닌 해외에 거주하고 있어도  온라인 상담을 예약할 수 있나요?
      answer: A. 심리상담에 대한 면허 및 법적 규정은 국가와 지역에 따라 다를 수 있습니다. 이에 따라 저는 대한민국 내에서 전문 자격을 보유하고 있으며, 상담 시점에 대한민국에 실제로 체류하고 계신 분들을 대상으로만 온라인 상담 서비스를 제공하고 있습니다.

    - name: 미국 보험사에 직접 청구(direct billing)가 가능한가요?
      answer: A. 아니요. 다만, 필요하신 경우 미국 보험사에 본인이 직접 환급(reimbursement)을 신청하실 수 있도록 invoice 및 superbill을 제공해 드릴 수 있습니다. 보험 적용 여부 및 환급 가능 금액은 가입하신 보험사의 정책과 보장 내용에 따라 달라질 수 있습니다.

    - name: 결제는 어떻게 할 수 있나요?
      answer: |
        A. 비대면 온라인 상담의 결제 옵션은 아래와 같습니다.
        * **계좌이체**: 박우아, 하나은행 336-910487-67107
        * **신용카드**(BC, 농협, 국민, 신한, 하나, 삼성, 현대, 롯데, 우리): “결제선생” 으로 받은 알림을 통해
        * **간편결제**(네이버페이, 엘.페이, 카카오페이): “결제선생”으로 받은 알림을 통해

        대면상담의 경우 카드 단말기를 통한 현장 결제도 가능합니다. 현장 결제를 선호하시는 경우 예약 요청시 미리 알려주시길 바랍니다. 


    - name: “결제선생” 은 어떤 서비스인가요?
      answer: A. 결제선생은 국내 여러 사업장에서 사용하는 안전한 온라인 결제 서비스입니다. 카카오톡 알림톡 또는 문자메시지를 통해 결제 요청을 편리하게 전송할 수 있으며, 고객은 별도로 방문하지 않고도 온라인으로 신용카드 결제를  편리하게 진행할 수 있습니다.

    - name: 해외 발행 카드로도 결제가 가능한가요? 그 외에는 또 어떤 결제 수단을 이용할 수 있나요?
      answer: "A. 네, 비자, 마스터, JCB, 아메리칸 익스프레스, 다이너스 클럽, 디스커버리, 삼성페이, 그리고 애플페이로도 단말기를 통한 대면 결제 가능합니다."

    # - name: 상담 예약 신청이 정상적으로 접수되었는지 어떻게 확인할 수 있나요?
    #   answer: A. 본 웹사이트의 "[예약하기](/booking)" 페이지를 통해 상담 예약을 신청하시면, 첫 상담 전에 귀하가 선택하신 언어(한국어 또는 영어)로 된 초기 접수 서류를 보내드립니다. 또한 예약 시간 확보를 위해 온라인 결제를 진행하실 수 있도록 결제선생에서 카카오톡 알림톡 혹은 문자 메세지를 통해 결제 안내를 보내드립니다. 결제가 확인되면 예약이 최종 확정됩니다. 결제 절차, 취소 및 환불 규정에 관한 자세한 내용은 초기 접수 서류에 포함된 결제 방침 동의서를 참고해 주시기 바랍니다.

    - name: 운영시간은 어떻게 되나요?
      answer: |
        * 화요일 ~ 금요일: 12:30pm - 8:30pm 
        * 토요일: 10:00am - 6:00pm
        * 휴무일: 일요일과 월요일

    - name: <심리상담소 봄나눔>의 연락처는 어떻게 되나요? 
      answer: |
        * 이메일: sharingspring2026@gmail.com
        * 전화: 010-7917-2273

