    - date: "2026-06-30"
      # title: "상담 서비스 운영 안내"
      body: |
       심리상담소 봄나눔은 한국어와 영어를 사용하는 모든 내담자분들께 따뜻하고, 문화적으로 민감하며, 접근 가능한 심리상담을 제공하기 위해 노력하고 있습니다. 보다 공정하고 일관된 상담 서비스를 제공하고, 내담자분들의 다양한 필요에 더욱 폭넓게 응답하기 위해 다음과 같이 상담 서비스를 운영하고자 합니다.

       2026년 7월 12일부터:
        * 개인심리상담(50분) 비용은 상담 언어(한국어 또는 영어)와 관계없이 회기당 120,000원으로 동일하게 적용됩니다.
        * 온라인 상담과 대면상담 모두 회기당 120,000원의 동일한 비용으로 이용하실 수 있으며, 내담자분의 상황과 필요에 맞는 상담 방식을 선택하실 수 있습니다.

       이중언어 상담사로서 저는 상담의 가치는 상담이 이루어지는 언어나 방식이 아니라, 전문적이고 신뢰를 형성할 수 있는 상담적 역량에 있다고 믿습니다. 본 변경 건은 모든 내담자분들께 보다 공정하고 일관된 기준으로 상담 서비스를 제공하고자 하는 Sharing Spring의 방향을 반영한 것입니다.
       그동안 대면상담을 희망해 주신 분들의 의견을 반영하여, 온라인 상담과 함께 대면상담도 새롭게 제공하게 되었습니다. 현재 사무실은 편안한 대면상담을 제공 해 드리기에 적합하지 않아 대면상담 요청시 더 편리하게 방문하실 수 있는 별도 장소의 자세한 주소를 공유드리고 있습니다. 앞으로도 내담자분들께서 귀하의 상황과 선호하는 방식으로 상담을 이어가실 수 있도록 더 적극적으로 돕고자 합니다. 원활한 전환을 위해 기존에 안내드린 상담 비용 및 프로모션은 아래와 같이 그대로 유지됩니다.

        * 현재 상담을 받고 계신 내담자분께는 상담 시작 시 안내드린 비용이 계속 적용됩니다.
        * 2026년 7월 11일까지 상담을 예약하신 신규 내담자분께는 기존에 안내드린 첫 회기 50% 할인 혜택이 그대로 적용되며, 첫 상담 일정이 2026년 7월 11일 이후인 경우에도 동일하게 혜택을 받으실 수 있습니다.

       2026년 7월 12일부터 상담을 예약하시는 신규 내담자분께는 개인심리상담 비용 회기당 120,000원이 적용됩니다.

       경제적인 이유로 상담을 시작하기 어려운 분들을 위해 제한된 인원에 한해 비용을 조율하는 상담도 운영하고 있습니다. 상담 비용이 상담을 시작하는 데 큰 부담이 되는 경우에는 현재 이용 가능 여부를 편하게 문의해 주세요.

       항상 보내주시는 응원과 관심에 진심으로 감사드립니다. 앞으로도 다양한 배경과 경험을 지닌 내담자분들께 따뜻하고 안전한 공간에서 함께 고민하며 성장할 수 있는 상담을 제공할 수 있도록 최선을 다하겠습니다.

       감사합니다.

